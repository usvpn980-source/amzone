<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with OTP</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="card">
        <!-- Step 1: Payment Details & Phone Input -->
        <div id="step1" class="step active">
            <h2>Payment Details</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" value="315" readonly>
                </div>
                <div class="form-group">
                    <label for="phone">Mobile Number (with Country Code)</label>
                    <input type="tel" id="phone" placeholder="+919876543210" required>
                </div>
                
                <!-- Invisible reCAPTCHA container -->
                <div id="recaptcha-container"></div>

                <button type="submit" id="sendOtpBtn">Send OTP</button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step2" class="step">
            <h2>Enter OTP</h2>
            <p>Verification code sent to your phone</p>
            <form id="otpForm">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" required>
                    <input type="text" maxlength="1" required>
                    <input type="text" maxlength="1" required>
                    <input type="text" maxlength="1" required>
                    <input type="text" maxlength="1" required>
                    <input type="text" maxlength="1" required>
                </div>
                <div id="timer" class="timer">Resend OTP in 30s</div>
                <button type="submit" id="verifyOtpBtn">Verify OTP & Pay</button>
            </form>
        </div>

        <!-- Step 3: Success -->
        <div id="step3" class="step">
            <div class="success-icon">✓</div>
            <h2>Payment Successful!</h2>
            <p>Your payment of ₹315 was completed.</p>
            <button onclick="location.reload()">Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
